name: tests-and-quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m coverage run -m pytest && python -m coverage report --fail-under=70
      - run: ruff check .
      - run: mypy scheduler
      - run: docker build -t timetable-project .
